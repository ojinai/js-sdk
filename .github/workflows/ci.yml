name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint:check

      - name: Test
        run: pnpm test

  publish-dryrun:
    name: Publish dry-run
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish dry-run
        run: |
          set -o pipefail
          pnpm run publish:dryrun | tee publish-dryrun.txt

      - name: Upload publish dry-run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-dryrun-output
          path: publish-dryrun.txt

  grep-guardrails:
    name: Grep guard-rails
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      # ── AC-1: no raw console.* anywhere in src/ ──────────────────────────
      # src/utils/logger.ts is the sole authorised console adapter; all other
      # code must route output through the injected OjinLogger.
      - name: No raw console.* in src/
        run: |
          if rg -n "console\." src/ --glob '!src/utils/logger.ts'; then
            echo "::error::Raw console.* found outside src/utils/logger.ts — use the injected OjinLogger instead."
            exit 1
          fi

      # ── AC-2/3: no unowned setTimeout/setInterval in src/ ─────────────────
      # Allowlisted files are the locations where timers are legitimately
      # owned:
      #   src/utils/sleep.ts          — generic abortable sleep primitive
      #   src/ws-transport-node.ts    — Node WebSocket heartbeat (uses .unref())
      #
      # To add another owner, update the glob list here — the required CI-config
      # change surfaces the new ownership in code review.
      - name: No unowned setTimeout/setInterval in src/
        run: |
          if rg -n "(setTimeout|setInterval)\(" src/ \
            --glob '!src/utils/sleep.ts' \
            --glob '!src/ws-transport-node.ts'; then
            echo "::error::Unowned setTimeout/setInterval found in src/. To allow it, add the owning file to the allowlist in .github/workflows/ci.yml so the new ownership is visible in code review."
            exit 1
          fi
